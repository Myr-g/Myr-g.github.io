<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Christopher (Myr) - Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>


<body>
  <div class="overlay"></div>

  <nav>
    <a href="index.html">home</a>
    <a href="projects.html">projects</a>
    <a href="about.html">about</a>
  </nav>

  <main>
    <div class="terminal-card home">
      <h1 class="title">Hey, I'm Christopher</h1>
      <p class="subtitle">Developer • Game Designer • Creative Arts</p>

      <p id="intro" class="intro"></p>

      <div class="buttons">
        <a class="btn" href="projects.html">/projects</a>
        <a class="btn" href="about.html">/about.txt</a>
      </div>
    </div>
  </main>

  <script>
    const lines = [
      "initializing portfolio...",
      "loading personal data...",
      "connection established."
    ];

    const intro = document.getElementById("intro");

    let lineIndex = 0;
    let charIndex = 0;
    let deleting = false;

    function terminalWrite() {
      const current = lines[lineIndex];

      if(!deleting)
      {
        intro.textContent = current.slice(0, charIndex++);

        if(charIndex > current.length)
        {
          if(lineIndex === lines.length - 1)
          {
            return; 
          }

          deleting = true;
          setTimeout(terminalWrite, 1000);
          return;
        }
      } 
    
      else
      {
        intro.textContent = current.slice(0, charIndex--);

        if(charIndex === 0)
        {
          deleting = false;
          lineIndex++;
        }
      }

      setTimeout(terminalWrite, deleting ? 30 : 50);
    }

    terminalWrite();
  </script>
</body>

<footer class="status-bar">
    <span class="status">status: connected | node: home-Dc1313 | signal: stable</span>
</footer>

</html>
